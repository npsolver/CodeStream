server:
  port: 8082

codestream:
  results:
    retention-days: ${RESULT_RETENTION_DAYS:1}
    cleanup-cron: ${RESULT_CLEANUP_CRON:0 0 * * * *}
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT_URL:}
    submission-queue-url: ${SQS_SUBMISSION_QUEUE_URL:}
    result-queue-url: ${SQS_RESULT_QUEUE_URL:}
    poll-interval-ms: ${SQS_POLL_INTERVAL_MS:1000}
    max-messages: ${SQS_MAX_MESSAGES:10}
    visibility-timeout-seconds: ${SQS_VISIBILITY_TIMEOUT_SECONDS:60}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codestream}${POSTGRES_JDBC_PARAMS:}
    username: ${POSTGRES_USER:codestream}
    password: ${POSTGRES_PASSWORD:codestream}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

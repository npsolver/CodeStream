execution:
  docker:
    binary: ${EXECUTION_DOCKER_BINARY:docker}
    image: ${EXECUTION_DOCKER_IMAGE:codestream-python-runner:latest}
    timeout-seconds: ${EXECUTION_DOCKER_TIMEOUT_SECONDS:3}
    max-output-bytes: ${EXECUTION_DOCKER_MAX_OUTPUT_BYTES:10000}
    memory-mb: ${EXECUTION_DOCKER_MEMORY_MB:128}
    cpus: ${EXECUTION_DOCKER_CPUS:0.5}
    pids-limit: ${EXECUTION_DOCKER_PIDS_LIMIT:64}

codestream:
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT_URL:}
    submission-queue-url: ${SQS_SUBMISSION_QUEUE_URL:}
    result-queue-url: ${SQS_RESULT_QUEUE_URL:}
    poll-interval-ms: ${SQS_POLL_INTERVAL_MS:1000}
    max-messages: ${SQS_MAX_MESSAGES:10}
    visibility-timeout-seconds: ${SQS_VISIBILITY_TIMEOUT_SECONDS:60}
